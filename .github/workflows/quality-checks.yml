name: Quality checks

on:
  push:
  pull_request:

jobs:
  python-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression tests
        env:
          MPLBACKEND: Agg
        run: pytest -q

  swift-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type-check Foundation-only signal-processing core
        run: swiftc -typecheck ios/Pulse/Models/*.swift ios/Pulse/SignalProcessing/*.swift
